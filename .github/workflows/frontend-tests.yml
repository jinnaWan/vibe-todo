name: Frontend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'MyProject.Client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'MyProject.Client/**'
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: 'Use self-hosted runners'
        type: boolean
        default: true

env:
  USE_SELF_HOSTED: ${{ inputs.use_self_hosted != false }}

permissions:
  contents: read
  actions: write
  id-token: write
  pull-requests: read

jobs:
  start-runner:
    if: ${{ inputs.use_self_hosted != false }}
    uses: ./.github/workflows/manage-runner.yml
    with:
      action: start
      config: frontend
      labels: nodejs,frontend
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  lint:
    name: Lint
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    needs: [start-runner]
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') }}
    
    defaults:
      run:
        working-directory: ./MyProject.Client
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './MyProject.Client/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

  test:
    name: Test
    needs: [start-runner, lint]
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') && (needs.lint.result == 'success') }}
    
    defaults:
      run:
        working-directory: ./MyProject.Client
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './MyProject.Client/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:coverage
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./MyProject.Client/coverage/

  build:
    name: Build
    needs: [start-runner, test]
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') && (needs.test.result == 'success') }}
    
    defaults:
      run:
        working-directory: ./MyProject.Client
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './MyProject.Client/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./MyProject.Client/dist/

  stop-runner:
    if: ${{ always() && inputs.use_self_hosted != false && needs.start-runner.outputs.task_arn }}
    needs: [start-runner, lint, test, build]
    uses: ./.github/workflows/manage-runner.yml
    with:
      action: stop
      config: frontend
      task_arn: ${{ needs.start-runner.outputs.task_arn }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }} 