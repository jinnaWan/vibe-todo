name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'
  pull_request:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'

permissions:
  contents: write
  actions: write
  id-token: write
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      
      - name: Run dotnet format (fix mode)
        run: dotnet format MyProject.sln
      
      - name: Check for changes after formatting
        id: git-check
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::warning::Code formatting issues were found and fixed. In a real-world scenario, you would commit these changes."
            git diff
          else
            echo "No formatting issues found."
          fi
        continue-on-error: true

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build MyProject.sln --configuration Release --no-restore

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build (for tests)
        run: dotnet build MyProject.sln --configuration Release --no-restore
      
      - name: Run tests with coverage
        run: dotnet test MyProject.sln --configuration Release --no-restore --collect:"XPlat Code Coverage"
      
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
      - name: Generate coverage report
        run: |
          reportgenerator \
          -reports:**/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:"Html;Cobertura"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*'
          retention-days: 7
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage-report
          retention-days: 7

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Publish
        run: dotnet publish MyProject.Api/MyProject.Api.csproj --configuration Release --no-restore --output ./publish
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish
          retention-days: 7
    
    release:
      name: Test Cross Repository Release
      needs: publish
      runs-on: ubuntu-latest

      steps:
        - name: Checkout ToaaNiung repository
          uses: actions/checkout@v4
          with:
            repository: jinnaWan/ToaaNiung
            fetch-depth: 0
            token: ${{ secrets.CROSS_REPO_PAT }}

        - name: Create or Update GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: "Test Tag"
            name: "Release Candidate Test Tag"
            target_commitish: main
            draft: false
            prerelease: true
            generate_release_notes: true
            token: ${{ secrets.CROSS_REPO_PAT }}
            body: |
              ## 🚀 Release Candidate: RC ToaaNiung

              **Automatically promoted from nightly E2E test run in flowaccount.workspace**

              ### 📊 Test Results
              - ✅ All E2E smoke tests passed (flowaccount.workspace)
              - 🏷️ Nightly Tag: Nightly Tag
              - 🏷️ RC Tag: Release Candidate

              ### 📅 Build Information
              - **Date**: ${{ github.event.repository.updated_at }}
              - **Triggered by**: @${{ github.actor }}
              - **Workflow Run**: [View Details](https://github.com/jinnaWan/vibe-todo/actions/runs/${{ github.run_id }})

              ---