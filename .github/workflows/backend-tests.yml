name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'
  pull_request:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: 'Use self-hosted runners'
        type: boolean
        default: true

env:
  USE_SELF_HOSTED: ${{ inputs.use_self_hosted != false }}

permissions:
  contents: read
  actions: write
  id-token: write
  pull-requests: read

jobs:
  start-runner:
    if: ${{ inputs.use_self_hosted != false }}
    uses: ./.github/workflows/manage-runner.yml
    with:
      action: start
      config: backend
      labels: dotnet,backend
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  lint:
    name: Lint
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    needs: [start-runner]
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # Option 1: Apply format fixes automatically
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      
      - name: Run dotnet format (fix mode)
        run: dotnet format MyProject.sln
      
      - name: Check for changes after formatting
        id: git-check
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::warning::Code formatting issues were found and fixed. In a real-world scenario, you would commit these changes."
            git diff
          else
            echo "No formatting issues found."
          fi
        continue-on-error: true

  test:
    name: Test
    needs: [start-runner, lint]
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') && (needs.lint.result == 'success') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Run tests with coverage
        run: dotnet test MyProject.sln --configuration Release --no-restore --collect:"XPlat Code Coverage"
      
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
      - name: Generate coverage report
        run: |
          reportgenerator \
          -reports:**/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:"Html;Cobertura"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*'
          retention-days: 7
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage-report
          retention-days: 7

  build:
    name: Build
    needs: [start-runner, test]
    runs-on: ${{ (inputs.use_self_hosted != false && needs.start-runner.outputs.runner_label) || 'ubuntu-latest' }}
    if: ${{ always() && (needs.start-runner.result == 'success' || needs.start-runner.result == 'skipped') && (needs.test.result == 'success') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build MyProject.sln --configuration Release --no-restore
      
      - name: Publish
        run: dotnet publish MyProject.Api/MyProject.Api.csproj --configuration Release --no-restore --output ./publish
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish
          retention-days: 7

  stop-runner:
    if: ${{ always() && inputs.use_self_hosted != false && needs.start-runner.outputs.task_arn }}
    needs: [start-runner, lint, test, build]
    uses: ./.github/workflows/manage-runner.yml
    with:
      action: stop
      config: backend
      task_arn: ${{ needs.start-runner.outputs.task_arn }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }} 