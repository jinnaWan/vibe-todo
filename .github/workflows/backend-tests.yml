name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'
  pull_request:
    branches: [ main ]
    paths:
      - 'MyProject.Api/**'
      - 'MyProject.Api.UnitTests/**'
      - 'MyProject.sln'

permissions:
  contents: write
  actions: write
  id-token: write
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format
      
      - name: Run dotnet format (fix mode)
        run: dotnet format MyProject.sln
      
      - name: Check for changes after formatting
        id: git-check
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "::warning::Code formatting issues were found and fixed. In a real-world scenario, you would commit these changes."
            git diff
          else
            echo "No formatting issues found."
          fi
        continue-on-error: true

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build MyProject.sln --configuration Release --no-restore

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Build (for tests)
        run: dotnet build MyProject.sln --configuration Release --no-restore
      
      - name: Run tests with coverage
        run: dotnet test MyProject.sln --configuration Release --no-restore --collect:"XPlat Code Coverage"
      
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
      - name: Generate coverage report
        run: |
          reportgenerator \
          -reports:**/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:"Html;Cobertura"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*'
          retention-days: 7
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage-report
          retention-days: 7

  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Install dependencies
        run: dotnet restore
      
      - name: Publish
        run: dotnet publish MyProject.Api/MyProject.Api.csproj --configuration Release --no-restore --output ./publish
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./publish
          retention-days: 7
    
release:
  name: Test Cross Repository Release
  needs: publish
  runs-on: ubuntu-latest

  steps:
    - name: Checkout ToaaNiung repository
      uses: actions/checkout@v4
      with:
        repository: jinnaWan/ToaaNiung
        fetch-depth: 0
        token: ${{ secrets.CROSS_REPO_PAT }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "actions@github.com"

    # NEW STEP: Create and push the tag first
    - name: Create and push tag
      id: create_tag
      run: |
        TAG_NAME="test-tag-v1.0.0"  # Use a valid tag name (no spaces!)
        
        # Fetch all tags
        git fetch --tags
        
        # Delete if exists (optional, for testing)
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          echo "⚠️ Tag $TAG_NAME already exists - deleting and recreating"
          git tag -d "$TAG_NAME"
          git push --delete origin "$TAG_NAME" || echo "Tag already deleted from remote"
        fi
        
        # Create and push tag
        git tag -a "$TAG_NAME" -m "Test release tag for cross-repo release"
        git push origin "$TAG_NAME"
        
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "✅ Created and pushed tag: $TAG_NAME"

    # NOW create the release using the tag that exists
    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.create_tag.outputs.tag_name }}  # Use the tag we just created
        name: "Release Candidate ${{ steps.create_tag.outputs.tag_name }}"
        target_commitish: main
        draft: false
        prerelease: true
        generate_release_notes: true
        token: ${{ secrets.CROSS_REPO_PAT }}
        body: |
          ## 🚀 Release Candidate: RC ToaaNiung

          **Automatically promoted from nightly E2E test run in toaaniung.workspace**

          ### 📊 Test Results
          - ✅ All E2E smoke tests passed (toaaniung.workspace)
          - 🏷️ Test Tag: ${{ steps.create_tag.outputs.tag_name }}

          ### 📅 Build Information
          - **Date**: ${{ github.event.repository.updated_at }}
          - **Triggered by**: @${{ github.actor }}
          - **Workflow Run**: [View Details](https://github.com/jinnaWan/vibe-todo/actions/runs/${{ github.run_id }})

          ---